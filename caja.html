<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Caja - Control de Cierre</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef2f7;
    color:#172033;
}


/* =========================
   CABECERA
========================= */

header{
    background:#172554;
    color:white;
    padding:20px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:7px 0 0;
    font-size:14px;
}


/* =========================
   CONTENEDOR
========================= */

.container{
    max-width:900px;
    margin:auto;
    padding:18px 15px 30px;
}


/* =========================
   BOTON VOLVER
========================= */

.topbar{
    max-width:900px;
    margin:auto;
    padding:12px 15px 0;
}

.btn-volver{
    border:0;
    background:#475569;
    color:white;
    padding:10px 15px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}


/* =========================
   CARD
========================= */

.card{
    background:white;
    border-radius:15px;
    padding:17px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
    margin:0 0 15px;
    color:#172554;
    font-size:19px;
}


/* =========================
   DATOS CAJERO
========================= */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font-size:16px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
}


/* =========================
   QUITAR FLECHAS
========================= */

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
    -webkit-appearance:none;
    margin:0;
}

input[type=number]{
    -moz-appearance:textfield;
}


/* =========================
   VENTA ACTUAL
========================= */

.venta-selector{
    background:#eff6ff;
    border:2px solid #bfdbfe;
    border-radius:14px;
    padding:17px;
    text-align:center;
}

.venta-selector label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
    color:#475569;
}

.venta-selector select{
    max-width:300px;
    margin:auto;
    display:block;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:#172554;
}


/* =========================
   CARGA
========================= */

.carga{
    margin-top:15px;
}

.carga-row{
    display:grid;
    grid-template-columns:145px 1fr;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
}

.carga-row label{
    font-weight:bold;
    font-size:15px;
}

.carga-row input{
    font-size:18px;
}


/* =========================
   BOTON GUARDAR
========================= */

.btn-guardar{
    width:100%;
    border:0;
    border-radius:11px;
    padding:15px;
    background:#16a34a;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.btn-guardar:hover{
    background:#15803d;
}


/* =========================
   RESUMEN
========================= */

.tabla{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:10px;
}

.tabla th,
.tabla td{
    border:1px solid #e2e8f0;
    padding:11px 8px;
    text-align:center;
}

.tabla th{
    background:#172554;
    color:white;
    font-size:13px;
}

.tabla td{
    font-size:14px;
    background:#fff;
}

.tabla td:first-child{
    text-align:left;
    font-weight:bold;
    white-space:nowrap;
}

.total{
    font-weight:bold;
    background:#f1f5f9 !important;
}


/* =========================
   TOTAL GENERAL
========================= */

.total-general{
    margin-top:15px;
    background:#172554;
    color:white;
    border-radius:13px;
    padding:18px;
    text-align:center;
}

.total-general .titulo{
    font-size:14px;
}

.total-general .valor{
    margin-top:6px;
    font-size:30px;
    font-weight:bold;
}


/* =========================
   LIMPIAR TODO
========================= */

.btn-limpiar{
    width:100%;
    border:0;
    border-radius:10px;
    padding:13px;
    background:#dc2626;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}


/* =========================
   MENSAJE
========================= */

.mensaje{
    display:none;
    margin-top:12px;
    padding:11px;
    border-radius:9px;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}

.mensaje.ok{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .grid{
        grid-template-columns:1fr;
    }

    .carga-row{
        grid-template-columns:1fr;
        gap:5px;
    }

    .tabla{
        font-size:12px;
    }

    .tabla th,
    .tabla td{
        padding:8px 4px;
    }

}

</style>

</head>


<body>


<header>

<h1>
💰 CAJA
</h1>

<p>
Control de ventas V1 • V2 • V3 • V4
</p>

</header>


<div class="topbar">

<button
class="btn-volver"
onclick="volverMenu()">

⬅️ Volver al menú

</button>

</div>


<div class="container">


<!-- =========================
     DATOS DEL CAJERO
========================= -->

<div class="card">

<h2>
👤 Datos del turno
</h2>

<div class="grid">

<div class="field">

<label>
Cajero
</label>

<input
type="text"
id="cajero"
placeholder="Nombre del cajero">

</div>


<div class="field">

<label>
Turno
</label>

<select id="turno">

<option value="07-15">
07:00 a 15:00
</option>

<option value="15-23">
15:00 a 23:00
</option>

<option value="23-07">
23:00 a 07:00
</option>

</select>

</div>

</div>

</div>


<!-- =========================
     CAJA
========================= -->

<div class="card">

<h2>
🧾 Cargar venta
</h2>


<div class="venta-selector">

<label>
VENTA QUE ESTÁS CARGANDO
</label>

<select
id="ventaSeleccionada">

<option value="V1">
VENTA 1 — V1
</option>

<option value="V2">
VENTA 2 — V2
</option>

<option value="V3">
VENTA 3 — V3
</option>

<option value="V4">
VENTA 4 — V4
</option>

</select>

</div>


<div class="carga">


<div class="carga-row">

<label>
💰 Depósito
</label>

<input
type="number"
id="deposito"
inputmode="decimal"
placeholder="$0">

</div>


<div class="carga-row">

<label>
💸 Retiro
</label>

<input
type="number"
id="retiro"
inputmode="decimal"
placeholder="$0">

</div>


<div class="carga-row">

<label>
🎁 Fichas regaladas
</label>

<input
type="number"
id="fichas"
inputmode="decimal"
placeholder="$0">

</div>


<div class="carga-row">

<label>
🛡️ Respaldo
</label>

<input
type="number"
id="respaldo"
inputmode="decimal"
placeholder="$0">

</div>


<button
class="btn-guardar"
onclick="guardarMovimiento()">

💾 GUARDAR

</button>


<div
id="mensaje"
class="mensaje">
</div>


</div>

</div>


<!-- =========================
     RESUMEN
========================= -->

<div class="card">

<h2>
📊 Resumen de las 4 ventas
</h2>


<table class="tabla">

<thead>

<tr>

<th>
Concepto
</th>

<th>
V1
</th>

<th>
V2
</th>

<th>
V3
</th>

<th>
V4
</th>

<th>
TOTAL
</th>

</tr>

</thead>


<tbody>


<tr>

<td>
💰 Depósito
</td>

<td id="v1Deposito">
$0
</td>

<td id="v2Deposito">
$0
</td>

<td id="v3Deposito">
$0
</td>

<td id="v4Deposito">
$0
</td>

<td
id="totalDeposito"
class="total">
$0
</td>

</tr>


<tr>

<td>
💸 Retiro
</td>

<td id="v1Retiro">
$0
</td>

<td id="v2Retiro">
$0
</td>

<td id="v3Retiro">
$0
</td>

<td id="v4Retiro">
$0
</td>

<td
id="totalRetiro"
class="total">
$0
</td>

</tr>


<tr>

<td>
🎁 Fichas
</td>

<td id="v1Fichas">
$0
</td>

<td id="v2Fichas">
$0
</td>

<td id="v3Fichas">
$0
</td>

<td id="v4Fichas">
$0
</td>

<td
id="totalFichas"
class="total">
$0
</td>

</tr>


<tr>

<td>
🛡️ Respaldo
</td>

<td id="v1Respaldo">
$0
</td>

<td id="v2Respaldo">
$0
</td>

<td id="v3Respaldo">
$0
</td>

<td id="v4Respaldo">
$0
</td>

<td
id="totalRespaldo"
class="total">
$0
</td>

</tr>


<tr>

<td>
📈 TOTAL VENTA
</td>

<td
id="v1Total"
class="total">
$0
</td>

<td
id="v2Total"
class="total">
$0
</td>

<td
id="v3Total"
class="total">
$0
</td>

<td
id="v4Total"
class="total">
$0
</td>

<td
id="totalGeneralTabla"
class="total">
$0
</td>

</tr>


</tbody>

</table>


<div class="total-general">

<div class="titulo">
💰 TOTAL GENERAL DE VENTAS
</div>

<div
class="valor"
id="totalGeneral">

$0

</div>

</div>


<button
class="btn-limpiar"
onclick="limpiarCaja()">

🗑️ LIMPIAR CAJA COMPLETA

</button>

</div>


</div>


<script>

/* =================================================
   DATOS
================================================= */

let caja = {

    V1:{
        deposito:0,
        retiro:0,
        fichas:0,
        respaldo:0
    },

    V2:{
        deposito:0,
        retiro:0,
        fichas:0,
        respaldo:0
    },

    V3:{
        deposito:0,
        retiro:0,
        fichas:0,
        respaldo:0
    },

    V4:{
        deposito:0,
        retiro:0,
        fichas:0,
        respaldo:0
    }

};


/* =================================================
   CARGAR DATOS GUARDADOS
================================================= */

function cargarCaja(){

    const datos =
        localStorage.getItem(
            "cajaControl"
        );

    if(datos){

        try{

            caja =
                JSON.parse(datos);

        }

        catch(error){

            console.error(error);

        }

    }


    const cajeroGuardado =
        localStorage.getItem(
            "cajeroControl"
        );

    if(cajeroGuardado){

        document.getElementById(
            "cajero"
        ).value =
            cajeroGuardado;

    }


    const turnoGuardado =
        localStorage.getItem(
            "turnoControl"
        );

    if(turnoGuardado){

        document.getElementById(
            "turno"
        ).value =
            turnoGuardado;

    }


    actualizarResumen();

}


/* =================================================
   GUARDAR MOVIMIENTO
================================================= */

function guardarMovimiento(){

    const venta =
        document.getElementById(
            "ventaSeleccionada"
        ).value;


    const deposito =
        numero("deposito");


    const retiro =
        numero("retiro");


    const fichas =
        numero("fichas");


    const respaldo =
        numero("respaldo");


    if(
        deposito === 0 &&
        retiro === 0 &&
        fichas === 0 &&
        respaldo === 0
    ){

        mostrarMensaje(
            "Ingresá al menos un monto.",
            "error"
        );

        return;

    }


    /*
       SUMAMOS EL MOVIMIENTO
       A LA VENTA ELEGIDA
    */

    caja[venta].deposito +=
        deposito;

    caja[venta].retiro +=
        retiro;

    caja[venta].fichas +=
        fichas;

    caja[venta].respaldo +=
        respaldo;


    /*
       GUARDAMOS
    */

    localStorage.setItem(
        "cajaControl",
        JSON.stringify(caja)
    );


    /*
       GUARDAMOS CAJERO Y TURNO
    */

    localStorage.setItem(
        "cajeroControl",
        document.getElementById(
            "cajero"
        ).value
    );


    localStorage.setItem(
        "turnoControl",
        document.getElementById(
            "turno"
        ).value
    );


    /*
       LIMPIAMOS SOLAMENTE
       LOS MONTOS INGRESADOS
    */

    document.getElementById(
        "deposito"
    ).value = "";

    document.getElementById(
        "retiro"
    ).value = "";

    document.getElementById(
        "fichas"
    ).value = "";

    document.getElementById(
        "respaldo"
    ).value = "";


    /*
       LA VENTA SELECCIONADA
       SE MANTIENE
    */

    actualizarResumen();


    mostrarMensaje(
        "✅ Movimiento guardado en " + venta,
        "ok"
    );

}


/* =================================================
   NUMERO
================================================= */

function numero(id){

    return parseFloat(
        document.getElementById(id).value
    ) || 0;

}


/* =================================================
   DINERO
================================================= */

function dinero(valor){

    return "$" +
        Math.round(
            Number(valor) || 0
        ).toLocaleString(
            "es-AR"
        );

}


/* =================================================
   ACTUALIZAR RESUMEN
================================================= */

function actualizarResumen(){

    let totalDeposito = 0;
    let totalRetiro = 0;
    let totalFichas = 0;
    let totalRespaldo = 0;
    let totalGeneral = 0;


    ["V1","V2","V3","V4"].forEach(
        function(venta){

            const datos =
                caja[venta];


            const totalVenta =
                datos.deposito +
                datos.fichas -
                datos.retiro -
                datos.respaldo;


            document.getElementById(
                venta.toLowerCase() +
                "Deposito"
            ).innerText =
                dinero(datos.deposito);


            document.getElementById(
                venta.toLowerCase() +
                "Retiro"
            ).innerText =
                dinero(datos.retiro);


            document.getElementById(
                venta.toLowerCase() +
                "Fichas"
            ).innerText =
                dinero(datos.fichas);


            document.getElementById(
                venta.toLowerCase() +
                "Respaldo"
            ).innerText =
                dinero(datos.respaldo);


            document.getElementById(
                venta.toLowerCase() +
                "Total"
            ).innerText =
                dinero(totalVenta);


            totalDeposito +=
                datos.deposito;

            totalRetiro +=
                datos.retiro;

            totalFichas +=
                datos.fichas;

            totalRespaldo +=
                datos.respaldo;

            totalGeneral +=
                totalVenta;

        }
    );


    document.getElementById(
        "totalDeposito"
    ).innerText =
        dinero(totalDeposito);


    document.getElementById(
        "totalRetiro"
    ).innerText =
        dinero(totalRetiro);


    document.getElementById(
        "totalFichas"
    ).innerText =
        dinero(totalFichas);


    document.getElementById(
        "totalRespaldo"
    ).innerText =
        dinero(totalRespaldo);


    document.getElementById(
        "totalGeneralTabla"
    ).innerText =
        dinero(totalGeneral);


    document.getElementById(
        "totalGeneral"
    ).innerText =
        dinero(totalGeneral);

}


/* =================================================
   MENSAJE
================================================= */

function mostrarMensaje(texto,tipo){

    const mensaje =
        document.getElementById(
            "mensaje"
        );


    mensaje.innerText =
        texto;


    mensaje.className =
        "mensaje " +
        tipo;


    setTimeout(
        function(){

            mensaje.className =
                "mensaje";

        },
        2500
    );

}


/* =================================================
   LIMPIAR CAJA
================================================= */

function limpiarCaja(){

    const confirmar =
        confirm(
            "⚠️ Vas a borrar todos los movimientos de V1, V2, V3 y V4.\n\n¿Querés continuar?"
        );


    if(!confirmar){

        return;

    }


    caja = {

        V1:{
            deposito:0,
            retiro:0,
            fichas:0,
            respaldo:0
        },

        V2:{
            deposito:0,
            retiro:0,
            fichas:0,
            respaldo:0
        },

        V3:{
            deposito:0,
            retiro:0,
            fichas:0,
            respaldo:0
        },

        V4:{
            deposito:0,
            retiro:0,
            fichas:0,
            respaldo:0
        }

    };


    localStorage.removeItem(
        "cajaControl"
    );


    actualizarResumen();


    mostrarMensaje(
        "🗑️ Caja limpiada correctamente.",
        "ok"
    );

}


/* =================================================
   VOLVER
================================================= */

function volverMenu(){

    window.location.href =
        "index.html";

}


/* =================================================
   GUARDAR CAJERO / TURNO
================================================= */

document.getElementById(
    "cajero"
).addEventListener(
    "input",
    function(){

        localStorage.setItem(
            "cajeroControl",
            this.value
        );

    }
);


document.getElementById(
    "turno"
).addEventListener(
    "change",
    function(){

        localStorage.setItem(
            "turnoControl",
            this.value
        );

    }
);


/* =================================================
   INICIO
================================================= */

cargarCaja();

</script>

</body>

</html>
