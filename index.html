<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control de Cierre</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef2f7;
    color:#172033;
}


/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#eef2f7;
}


.login-card{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}


.login-card h1{
    text-align:center;
    margin:0;
    color:#172554;
    font-size:26px;
}


.login-card p{
    text-align:center;
    color:#64748b;
    margin:8px 0 25px;
    font-size:14px;
}


.login-field{
    margin-bottom:16px;
}


.login-field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}


.login-field input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:16px;
}


.login-field input:focus{
    outline:none;
    border-color:#2563eb;
}


.login-button{
    width:100%;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}


.login-button:hover{
    background:#1d4ed8;
}


.login-error{
    display:none;
    margin-top:14px;
    background:#fee2e2;
    color:#991b1b;
    padding:11px;
    border-radius:9px;
    font-size:13px;
    text-align:center;
}


/* =========================
   APP
========================= */

#app{
    display:none;
}


header{
    background:#172554;
    color:white;
    padding:22px 15px;
    text-align:center;
}


header h1{
    margin:0;
    font-size:23px;
}


header p{
    margin:7px 0 0;
    font-size:14px;
}


.container{
    max-width:900px;
    margin:auto;
    padding:20px 15px;
}


.logout{
    background:#dc2626;
    color:white;
    border:0;
    border-radius:8px;
    padding:10px 14px;
    font-weight:bold;
    cursor:pointer;
}


.topbar{
    max-width:900px;
    margin:auto;
    padding:12px 15px 0;
    display:flex;
    justify-content:flex-end;
}


.welcome{
    background:white;
    border-radius:14px;
    padding:25px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}


.welcome h2{
    color:#172554;
    margin-top:0;
}


.welcome p{
    color:#64748b;
}


@media(max-width:600px){

    .login-card{
        padding:25px 20px;
    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

    <div class="login-card">

        <h1>🔐 Control de Cierre</h1>

        <p>
            Ingresá con tu usuario para continuar
        </p>


        <div class="login-field">

            <label>
                Usuario / Correo
            </label>

            <input
                type="email"
                id="loginEmail"
                value="cierre@admin.com"
                placeholder="Correo"
                autocomplete="username">

        </div>


        <div class="login-field">

            <label>
                Contraseña
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Contraseña"
                autocomplete="current-password"
                onkeydown="if(event.key==='Enter') iniciarSesion()">

        </div>


        <button
            class="login-button"
            onclick="iniciarSesion()">

            🔓 INGRESAR

        </button>


        <div
            id="loginError"
            class="login-error">
        </div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

    <header>

        <h1>
            CONTROL DE CIERRE
        </h1>

        <p>
            Sistema de control
        </p>

    </header>


    <div class="topbar">

        <button
            class="logout"
            onclick="cerrarSesion()">

            🚪 Cerrar sesión

        </button>

    </div>


    <div class="container">

        <div class="welcome">

            <h2>
                ✅ Bienvenido
            </h2>

            <p>
                El inicio de sesión funciona correctamente.
            </p>

            <p>
                Próximo paso: <b>CAJA</b>
            </p>

        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://cynrheajajovikwvapsb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_vjvUhh-flBiAv1WXHELWDw_kHjfWOCU";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   INICIAR SESIÓN
========================= */

async function iniciarSesion(){

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const errorBox =
        document.getElementById(
            "loginError"
        );


    errorBox.style.display = "none";


    if(!email || !password){

        errorBox.innerText =
            "Ingresá el usuario y la contraseña.";

        errorBox.style.display =
            "block";

        return;

    }


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if(error){

            console.error(error);

            errorBox.innerText =
                "Usuario o contraseña incorrectos.";

            errorBox.style.display =
                "block";

            return;

        }


        mostrarApp();

    }

    catch(error){

        console.error(error);

        errorBox.innerText =
            "No se pudo iniciar sesión.";

        errorBox.style.display =
            "block";

    }

}


/* =========================
   MOSTRAR APP
========================= */

function mostrarApp(){

    document.getElementById(
        "loginScreen"
    ).style.display = "none";


    document.getElementById(
        "app"
    ).style.display = "block";

}


/* =========================
   CERRAR SESIÓN
========================= */

async function cerrarSesion(){

    await supabaseClient.auth.signOut();

}


/* =========================
   CONTROL DE SESIÓN
========================= */

supabaseClient.auth.onAuthStateChange(

    function(event, session){

        if(session){

            mostrarApp();

        }

        else{

            document.getElementById(
                "app"
            ).style.display = "none";


            document.getElementById(
                "loginScreen"
            ).style.display = "flex";


            document.getElementById(
                "loginPassword"
            ).value = "";

        }

    }

);


/* =========================
   COMPROBAR SESIÓN
========================= */

async function comprobarSesion(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();


    if(
        data &&
        data.session
    ){

        mostrarApp();

    }

    else{

        document.getElementById(
            "loginScreen"
        ).style.display = "flex";


        document.getElementById(
            "app"
        ).style.display = "none";

    }

}


comprobarSesion();

</script>

</body>

</html>
