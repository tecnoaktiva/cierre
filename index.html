<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Cierre de Turno</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.25rem; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        .result { padding: 10px; border-radius: 6px; font-weight: bold; text-align: center; margin-top: 10px; }
        .ok { background: #dcfce7; color: #15803d; }
        .faltante { background: #fee2e2; color: #b91c1c; }
        .sobrante { background: #fef9c3; color: #a16207; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
        th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; }
        th { background: #f1f5f9; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- FORMULARIO DE REGISTRO -->
    <div class="card">
        <h2>Cierre de Turno</h2>
        <form id="cierreForm">
            <div class="grid-2">
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label>Turno</label>
                    <select id="turno" onchange="toggleFee10AM()">
                        <option value="07:00–15:00">07:00–15:00</option>
                        <option value="15:00–23:00">15:00–23:00</option>
                        <option value="23:00–07:00">23:00–07:00</option>
                    </select>
                </div>
            </div>

            <label>Ventas del Turno</label>
            <div class="grid-2">
                <input type="number" step="0.01" id="v1" placeholder="Venta 1" value="0">
                <input type="number" step="0.01" id="v2" placeholder="Venta 2" value="0">
                <input type="number" step="0.01" id="v3" placeholder="Venta 3" value="0">
                <input type="number" step="0.01" id="v4" placeholder="Venta 4" value="0">
            </div>

            <div class="grid-2" style="margin-top: 10px;">
                <div class="form-group">
                    <label>Saldo Inicial App</label>
                    <input type="number" step="0.01" id="saldoInicial" value="0">
                </div>
                <div class="form-group" id="groupFee10">
                    <label>Fee de las 10:00</label>
                    <input type="number" step="0.01" id="fee10" value="0">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Gastos (-)</label>
                    <input type="number" step="0.01" id="gastos" value="0">
                </div>
                <div class="form-group">
                    <label>Retiros (-)</label>
                    <input type="number" step="0.01" id="retiros" value="0">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Préstamos/Respaldo (±)</label>
                    <input type="number" step="0.01" id="prestamos" value="0">
                </div>
                <div class="form-group">
                    <label>Saldo REAL en Billetera</label>
                    <input type="number" step="0.01" id="saldoReal" required placeholder="Monto en App">
                </div>
            </div>

            <button type="submit">Guardar y Procesar Cierre</button>
        </form>
    </div>

    <!-- HISTORIAL DE CIERRES -->
    <div class="card">
        <h2>Historial de Cierres Guardados</h2>
        <button onclick="borrarTodo()" style="background:#ef4444; margin-bottom:10px; padding:6px; font-size:0.8rem;">Borrar Historial</button>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Fecha/Turno</th>
                        <th>Bruto</th>
                        <th>Com. 0.6%</th>
                        <th>Teórico</th>
                        <th>Real</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaHistorial"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.getElementById('fecha').valueAsDate = new Date();

    function toggleFee10AM() {
        const turno = document.getElementById('turno').value;
        const groupFee = document.getElementById('groupFee10');
        if (turno === "07:00–15:00") {
            groupFee.classList.remove('hidden');
        } else {
            groupFee.classList.add('hidden');
            document.getElementById('fee10').value = 0;
        }
    }

    document.getElementById('cierreForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const fecha = document.getElementById('fecha').value;
        const turno = document.getElementById('turno').value;
        const v1 = parseFloat(document.getElementById('v1').value) || 0;
        const v2 = parseFloat(document.getElementById('v2').value) || 0;
        const v3 = parseFloat(document.getElementById('v3').value) || 0;
        const v4 = parseFloat(document.getElementById('v4').value) || 0;
        
        const saldoInicial = parseFloat(document.getElementById('saldoInicial').value) || 0;
        const fee10 = parseFloat(document.getElementById('fee10').value) || 0;
        const gastos = parseFloat(document.getElementById('gastos').value) || 0;
        const retiros = parseFloat(document.getElementById('retiros').value) || 0;
        const prestamos = parseFloat(document.getElementById('prestamos').value) || 0;
        const saldoReal = parseFloat(document.getElementById('saldoReal').value) || 0;

        // Cálculos
        const ingresoBruto = v1 + v2 + v3 + v4;
        const comision06 = ingresoBruto * 0.006;
        const ingresoNeto = ingresoBruto - comision06 - fee10;
        
        const saldoTeorico = saldoInicial + ingresoNeto - gastos - retiros + prestamos;
        const diferencia = saldoReal - saldoTeorico;

        let estado = "CUADRADO";
        if (diferencia < -0.01) estado = `FALTANTE ($${Math.abs(diferencia).toFixed(2)})`;
        if (diferencia > 0.01) estado = `SOBRANTE ($${diferencia.toFixed(2)})`;

        const registro = {
            fecha, turno, ingresoBruto, comision06, saldoTeorico, saldoReal, diferencia, estado
        };

        guardarEnLocalStorage(registro);
        actualizarTabla();
        alert(`Cierre Guardado con éxito. Estado: ${estado}`);
    });

    function guardarEnLocalStorage(registro) {
        let historial = JSON.parse(localStorage.getItem('cierres_turno')) || [];
        historial.unshift(registro); // Agregar al principio
        localStorage.setItem('cierres_turno', JSON.stringify(historial));
    }

    function actualizarTabla() {
        const historial = JSON.parse(localStorage.getItem('cierres_turno')) || [];
        const tbody = document.getElementById('tablaHistorial');
        tbody.innerHTML = '';

        historial.forEach(item => {
            let claseEstado = "ok";
            if (item.diferencia < -0.01) claseEstado = "faltante";
            if (item.diferencia > 0.01) claseEstado = "sobrante";

            tbody.innerHTML += `
                <tr>
                    <td><b>${item.fecha}</b><br>${item.turno}</td>
                    <td>$${item.ingresoBruto.toFixed(2)}</td>
                    <td>$${item.comision06.toFixed(2)}</td>
                    <td>$${item.saldoTeorico.toFixed(2)}</td>
                    <td>$${item.saldoReal.toFixed(2)}</td>
                    <td class="${claseEstado}">${item.estado}</td>
                </tr>
            `;
        });
    }

    function borrarTodo() {
        if(confirm("¿Seguro que quieres borrar todo el historial?")) {
            localStorage.removeItem('cierres_turno');
            actualizarTabla();
        }
    }

    // Cargar historial al abrir
    actualizarTabla();
    toggleFee10AM();
</script>

</body>
</html>
